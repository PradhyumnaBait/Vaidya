user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Rate limiting zones
    # 1. API request rate limit: 30 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    # 2. WebSocket session connection rate limit: 10 connections/minute per IP
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/m;

    # Upstream backend service
    upstream medikiosk_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Client body size for document uploads (max 10MB)
        client_max_body_size 10M;

        # Gzip compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css application/xml;

        # WebSocket intake gateway
        location /ws/ {
            limit_req zone=ws_limit burst=5 nodelay;

            proxy_pass http://medikiosk_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for kiosk interactive sessions
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # REST API endpoints
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://medikiosk_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks (no rate limiting)
        location /health {
            proxy_pass http://medikiosk_backend;
            access_log off;
        }

        # Swagger Docs (Development / Demo only)
        location /docs {
            proxy_pass http://medikiosk_backend;
        }

        location /openapi.json {
            proxy_pass http://medikiosk_backend;
        }
    }
}
