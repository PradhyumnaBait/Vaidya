[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "medikiosk-backend"
version = "1.0.0"
description = "MediKiosk AI Clinical Intake Backend — SIH26047"
authors = ["MediKiosk Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
uvloop = "^0.20"
websockets = "^12.0"
pydantic = "^2.7"
pydantic-settings = "^2.3"
redis = {extras = ["hiredis"], version = "^5.0"}
groq = "^0.9"
FlagEmbedding = "^1.2"
pinecone-client = "^3.2"
google-cloud-documentai = "^2.27"
httpx = "^0.27"
fhir-resources = "^7.1"
python-jose = {extras = ["cryptography"], version = "^3.3"}
cryptography = "^42.0"
asyncpg = "^0.29"
numpy = "^1.26"
rank-bm25 = "^0.2"
pillow = "^10.3"
python-multipart = "^0.0.9"
aiofiles = "^23.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-mock = "^3.14"
httpx = "^0.27"
anyio = "^4.4"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
